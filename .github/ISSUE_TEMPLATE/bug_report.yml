name: Сообщить об ошибке
description: Что-то пошло не так? Создайте отчёт — я разберусь.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете об ошибке. Чем подробнее опишете — тем быстрее исправлю.
  - type: textarea
    id: what-happened
    attributes:
      label: Что случилось?
      placeholder: Программа запустилась, но оценки не собрались...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Лог-файл
      description: Откройте `dnevnik-mesh-export_*.log`, скопируйте сюда
      render: text
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: Windows 11 24H2
  - type: dropdown
    id: browser
    attributes:
      label: Браузер
      options:
        - Google Chrome
        - Другой
    validations:
      required: true
